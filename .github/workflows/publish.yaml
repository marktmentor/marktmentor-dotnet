name: Publish to NuGet

# Runs on a version tag (v1.2.3), which the release workflow of marktmentor-sdk
# pushes. Uses NuGet Trusted Publishing: no stored API key. Needs a trusted
# publishing policy on nuget.org (owner marktmentor, repository
# marktmentor-dotnet, workflow publish.yaml, environment nuget) and the variable
# NUGET_USER (the nuget.org profile name) in the environment nuget.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only v* tags may use this environment. After the repository is public, add
    # yourself as required reviewer in Settings → Environments → nuget.
    environment: nuget
    permissions:
      contents: read
      id-token: write # GitHub OIDC token for NuGet Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: dotnet test MarktMentor.slnx -c Release
      - run: dotnet pack src/MarktMentor/MarktMentor.csproj -c Release -p:Version=${GITHUB_REF_NAME#v} -o out
      # Short-lived API key (1 hour), requested just before the push.
      - uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push "out/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
